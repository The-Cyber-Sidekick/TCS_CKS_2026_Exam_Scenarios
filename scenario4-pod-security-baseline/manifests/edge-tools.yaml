# The armed workload. node-inspector mounts the node's pod-log directory through a
# hostPath volume, so it can read every other pod's logs on that node: a baseline
# Pod Security Standard violation. status-page is an ordinary, compliant web pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-inspector
  namespace: edge-tools
spec:
  replicas: 1
  selector:
    matchLabels: {app: node-inspector}
  template:
    metadata:
      labels: {app: node-inspector}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: inspector
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: pod-logs
              mountPath: /host/pod-logs
              readOnly: true
      volumes:
        - name: pod-logs
          hostPath:
            path: /var/log/pods
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: edge-tools
spec:
  replicas: 1
  selector:
    matchLabels: {app: status-page}
  template:
    metadata:
      labels: {app: status-page}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: nginx:1.27-alpine
